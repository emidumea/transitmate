<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creeaza cont - TransitMate</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
    <h1>Creeaza cont</h1>
    <p>Cu un cont poti cumpara bilete si iti poti salva liniile favorite.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}">Eroare</div>

    <form th:action="@{/register}" method="post" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" th:value="${email}" required>

        <label for="password">Parola (cel putin 8 caractere)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>

        <label class="checkbox">
            <input type="checkbox" name="consent" value="true">
            <span>Sunt de acord cu prelucrarea datelor personale conform politicii de confidentialitate.</span>
        </label>

        <button type="submit">Creeaza contul</button>
    </form>
    <div class="nav"><a class="link" th:href="@{/}">Inapoi la pagina principala</a></div>
</main>
</body>
</html>
