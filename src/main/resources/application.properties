spring.application.name=transitmate

# Baza de date H2 in memorie: datele se reinitializeaza la fiecare pornire
spring.datasource.url=jdbc:h2:mem:transitmate;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Conturile de personal sunt create direct in baza de date pana la US-32.
# Parola se poate schimba cu variabila de mediu STAFF_PASSWORD.
transitmate.seed.staff-password=${STAFF_PASSWORD:Staff12345}
